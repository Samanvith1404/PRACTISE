<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to the CampusPortal student portal.">
    <title>Sign in | CampusPortal</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="login-card">
      <div class="brand-mark" aria-hidden="true">CP</div>
      <p class="eyebrow">YOUR CAMPUS, CONNECTED</p>
      <h1>Welcome back</h1>
      <p class="intro">Sign in with your campus account to continue.</p>

      <form id="login-form">
        <label for="username">Campus username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Sign in</button>
        <p id="login-message" class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="help-text">Need help? Contact your campus administrator.</p>
    </main>
  </body>
</html>
